spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:mysql://localhost:3306/carrental_customer_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  instance:
    prefer-ip-address: true
server:
  port: 8000