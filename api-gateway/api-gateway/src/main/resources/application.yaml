spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
#          discovery:
#            locator:
#              enabled: true
#              lower-case-service-id: true
          routes:
            - id: customer_service_route
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer-service/**
              filters:
                - StripPrefix=1
            - id: car_service_route
              uri: lb://CAR-SERVICE
              predicates:
                - Path=/car-service/**
              filters:
                - StripPrefix=1
            - id: renting_service_route
              uri: lb://RENTING-SERVICE
              predicates:
                - Path=/renting-service/**
              filters:
                - StripPrefix=1
server:
  port: 8765
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
